# Publish dsh-quick-model.
#
# Pushing a version tag is the whole release procedure:
#
#   npm version patch && git push --follow-tags
#
# or, without npm:
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# The job re-runs the package's own contract checks, publishes to npm (which is
# what makes `dsh plugin --profile <name> add dsh-quick-model` work for anyone),
# and attaches the tarball to a GitHub Release (a stable URL installers can
# fetch without npm).
#
# Authentication is OIDC trusted publishing: no token, no repository secret.
# npm permanently revoked all classic tokens on 2025-12-09 (which retired the
# old "Automation token in NPM_TOKEN" recipe this file used to carry), and
# bypass-2FA granular tokens are being restricted for direct publishing.
# Trusted publishing is the path npm now recommends.
#
# One-time setup on the package's npm settings page: add a Trusted Publisher
# with provider "GitHub Actions", repository `<owner>/dsh-quick-model`, and
# workflow filename `publish.yml`.
#
# Nothing here compiles: the package is plain JavaScript with no build step,
# which is also why a git-spec install works without pnpm's `allowBuilds`
# opt-in (pnpm blocks build scripts of git-hosted dependencies by default).
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm CLI 11.5.0 or later; Node 20 still
      # ships npm 10.x.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Check the tag against package.json
        if: github.event_name == 'push'
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}" >&2
            exit 1
          fi

      # `npm publish --provenance` requires a `repository` field, and npm checks
      # it against the repository the workflow actually runs in. Deriving the
      # three fields from GITHUB_REPOSITORY means a fork publishes correct
      # metadata without anyone hand-editing a placeholder — and the checked-in
      # package.json stays free of an account name that would be wrong for
      # anyone else.
      - name: Derive the repository metadata from this run
        run: |
          node -e "
            const fs = require('fs');
            const url = 'https://github.com/' + process.env.GITHUB_REPOSITORY;
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.repository = { type: 'git', url: url + '.git' };
            pkg.bugs = { url: url + '/issues' };
            pkg.homepage = url + '#readme';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # The same two scripts a user can run locally. Here they run in
      # self-check mode: the package is not installed under a profile yet, so
      # resolution falls back to this checkout and every other contract is still
      # enforced (loader patch, client bundle, host half, route handlers).
      - name: Verify the packaging contract
        run: node scripts/validate.mjs . dsh-quick-model

      - name: Verify the host half's routes and actions
        run: node scripts/smoke-host.mjs lib/index.js

      # No token and no secret: the CLI presents the workflow's OIDC identity to
      # npm, which authorizes the publish against the trusted-publisher
      # configuration on the package's npm settings page.
      #
      # One-time setup at https://www.npmjs.com/package/dsh-quick-model/access
      # (or the package's Settings → Trusted Publisher panel): provider GitHub
      # Actions, repository <owner>/dsh-quick-model, workflow filename
      # publish.yml. After that, tagging a release publishes without any
      # long-lived credential.
      - name: Publish to npm via trusted publishing
        run: npm publish --access public --provenance

      - name: Pack and attach the tarball to a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          gh release create "${GITHUB_REF_NAME}" ./*.tgz \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
